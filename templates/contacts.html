<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Ian Odiwuor</title>

  <!-- Favicon -->
  <link href="{{ url_for('static', filename='images/iano.jpg') }}" rel="icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="{{ url_for('static', filename='files/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='files/css/style.css') }}">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f2027;
      color: #fff;
    }

    .section {
      padding: 60px 20px;
    }

    .contact-info i {
      font-size: 2rem;
      color: #0dcaf0;
    }

    .contact-info p {
      margin: 0;
      color: #ccc;
    }

    .form-control,
    .btn {
      border-radius: 8px;
    }

    .btn-primary {
      background-color: #0dcaf0;
      border: none;
    }

    .btn-primary:hover {
      background-color: #0bbcd6;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="container-fluid">
    {% include 'navbar.html' %}
 

  </div>

  <!-- Contact Section -->
  <section id="contact" class="section">
    <div class="container">
      <h2 class="text-center text-info mb-5 animate__animated animate__fadeInDown">Get in Touch</h2>

      <div class="row gy-5">

        <!-- Contact Info -->
        <div class="col-md-5 contact-info">
          <div class="mb-4 d-flex align-items-start gap-3">
            <i class="bi bi-geo-alt"></i>
            <div>
              <h5 class="text-white">Location</h5>
              <p>Nairobi, Kenya</p>
            </div>
          </div>
          <div class="mb-4 d-flex align-items-start gap-3">
            <i class="bi bi-envelope"></i>
            <div>
              <h5 class="text-white">Email</h5>
              <p>odiwuorian@gmail.com</p>
            </div>
          </div>
          <div class="mb-4 d-flex align-items-start gap-3">
            <i class="bi bi-phone"></i>
            <div>
              <h5 class="text-white">Phone</h5>
              <p>+254 710 706735</p>
            </div>
          </div>
          <div class="mb-4 d-flex align-items-start gap-3">
            <i class="bi bi-linkedin"></i>
            <div>
              <h5 class="text-white">LinkedIn</h5>
              <p><a href="https://linkedin.com/in/...." class="text-info" target="_blank"></a></p>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <div class="col-md-7">
          <form action="/contacts" method="POST">
            <div class="mb-3">
              <label for="Name" class="form-label">Your Name</label>
              <input type="text" class="form-control" id="Name" name="Name" required>
            </div>
            <div class="mb-3">
              <label for="Email" class="form-label">Your Email</label>
              <input type="Email" class="form-control" id="Email" name="Email" required>
            </div>
            <div class="mb-3">
              <label for="Subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="Subject" name="Subject" required>
            </div>
            <div class="mb-3">
              <label for="Message" class="form-label">Message</label>
              <textarea class="form-control" id="Message" name="Message" rows="5" required></textarea>
            </div>
            <input type="submit" value="Submit info" class="btn btn-success">
          </form>
        </div>

      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='files/js/jquery.js') }}"></script>
  <script src="{{ url_for('static', filename='files/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='files/js/script.js') }}"></script>

</body>
{% include 'footer.html' %}

</html>
