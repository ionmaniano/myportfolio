<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - Ian Odiwuor</title>

  <!-- Favicon -->
  <link href="{{ url_for('static', filename='images/iano.jpg') }}" rel="icon" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="{{ url_for('static', filename='files/css/bootstrap.min.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='files/css/style.css') }}" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f2027;
      color: #fff;
    }

    .section {
      padding: 60px 20px;
    }

    .project-card {
      background-color: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-5px);
    }

    .project-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .project-content {
      padding: 20px;
    }

    .project-title {
      font-size: 1.2rem;
      color: #0dcaf0;
    }

    .project-description {
      font-size: 0.95rem;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="container-fluid">
    {% include 'navbar.html' %}
 
  </div>

  <!-- Project Section -->
  <section id="projects" class="section">
    <div class="container">
      <h2 class="text-center text-info mb-5 animate__animated animate__fadeInDown">My Projects</h2>

      <div class="row g-4">

        <!-- Project 1 -->
        <div class="col-md-4 animate__animated animate__fadeInUp" style="animation-delay: 0.4s;">
          <div class="project-card">
            <img src="{{ url_for('static', filename='images/iano3.jpg') }}" alt="Project 1" class="project-img" />
            <div class="project-content">
              <h4 class="project-title">Portfolio Website</h4>
              <p class="project-description">This personal portfolio site you're viewing now — designed with Flask, Bootstrap, and a touch of creativity.</p>
              <a href="https://github.com/ionmaniano" class="btn btn-outline-info btn-sm mt-2">GitHub Repo</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='files/js/jquery.js') }}"></script>
  <script src="{{ url_for('static', filename='files/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='files/js/script.js') }}"></script>

</body>
{% include 'footer.html' %}

</html>
